services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawcast-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/lawcast.db
      - OLLAMA_API_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    volumes:
      # Mount SQLite database to persist data
      - lawcast_db:/app/data
      # Optional: Mount logs directory
      - lawcast_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - lawcast-network
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawcast-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://backend:3001/api
      # SvelteKit adapter-node configuration
      - HOST=0.0.0.0
      - PORT=3002
    depends_on:
      backend:
        condition: service_started
    networks:
      - lawcast-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  redis:
    image: redis:8.8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    networks:
      - lawcast-network
    ports:
      - "127.0.0.1:6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:0.31.1
    container_name: lawcast-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - lawcast_ollama:/root/.ollama
    networks:
      - lawcast-network

networks:
  lawcast-network:
    driver: bridge

volumes:
  lawcast_db:
    driver: local
  lawcast_logs:
    driver: local
  lawcast_ollama:
    driver: local
