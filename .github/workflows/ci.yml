name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --coverage

      - name: Upload coverage artifact
        if: matrix.node-version == 24 && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ matrix.node-version }}
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

  sidecar:
    name: Sidecar — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-search

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Python version matches semantic-search/Dockerfile (python:3.13-slim).
      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: semantic-search/requirements.lock

      - name: Install dependencies
        run: |
          # CPU-only torch first, mirroring the Dockerfile: the default PyPI
          # linux wheel pulls multi-GB CUDA dependencies. torch version is read
          # from requirements.lock so the lock stays the single source of truth.
          pip install "torch==$(sed -n 's/^torch==//p' requirements.lock)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Unit tests
        run: python -m pytest tests/ -q

  ci-gate:
    name: CI gate
    if: always()
    needs: [backend, frontend, sidecar]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.sidecar.result }}" != "success" ]; then
            echo "❌ One or more jobs failed."
            exit 1
          fi
          echo "✅ All checks passed."

  deploy-backend:
    name: Deploy backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-gate]
    uses: ./.github/workflows/deploy-backend.yml
    secrets:
      VULTR_SSH_SECRET: ${{ secrets.VULTR_SSH_SECRET }}
      VULTR_WIREGUARD: ${{ secrets.VULTR_WIREGUARD }}
