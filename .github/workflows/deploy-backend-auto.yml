name: Deploy Backend (auto)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend after CI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy-backend.yml
    secrets:
      VULTR_SSH_SECRET: ${{ secrets.VULTR_SSH_SECRET }}
      VULTR_WIREGUARD: ${{ secrets.VULTR_WIREGUARD }}
