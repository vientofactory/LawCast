name: Deploy Semantic Search

on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "Skip CI checks before deploy"
        required: false
        default: false
        type: boolean
      allow_capability_loss:
        description: "Break-glass: deploy even if the index capability guard reports a lost class"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      skip_ci:
        required: false
        default: "false"
        type: string
      allow_capability_loss:
        required: false
        default: "false"
        type: string
    secrets:
      VULTR_SSH_SECRET:
        required: true
      VULTR_WIREGUARD:
        required: true

# Shares the deploy-backend group on purpose: both deploys reset and build in
# the same server working tree (/root/lawcast), so they must run serially.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  DEPLOY_HOST: 10.20.0.1
  REPO_PATH: /root/lawcast

jobs:
  deploy:
    name: Deploy semantic search to production
    runs-on: ubuntu-latest
    # Image rebuild plus a cold BGE-m3-ko download (~2.2GB) into a fresh cache
    # volume on first production boot.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup WireGuard
        env:
          VULTR_WIREGUARD: ${{ secrets.VULTR_WIREGUARD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools

          # Write WireGuard profile from secret (use printenv to avoid shell argument exposure)
          printenv VULTR_WIREGUARD > /tmp/wg0.conf
          sudo cp /tmp/wg0.conf /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf

          # Bring up WireGuard interface
          sudo wg-quick up wg0

          # Verify tunnel connectivity
          echo "Waiting for tunnel connection..."
          for i in $(seq 1 10); do
            if ping -c 1 -W 2 ${{ env.DEPLOY_HOST }} > /dev/null 2>&1; then
              echo "Tunnel is up — reachable at ${{ env.DEPLOY_HOST }}"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "ERROR: Cannot reach ${{ env.DEPLOY_HOST }} through WireGuard tunnel"
              sudo wg show
              exit 1
            fi
            sleep 2
          done

      - name: Configure SSH
        env:
          VULTR_SSH_SECRET: ${{ secrets.VULTR_SSH_SECRET }}
        run: |
          mkdir -p ~/.ssh
          printenv VULTR_SSH_SECRET > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat >> ~/.ssh/config <<EOF
          Host deploy-target
              HostName ${{ env.DEPLOY_HOST }}
              User ${{ vars.VULTR_SSH_USER }}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
              ConnectTimeout 10
          EOF

          # Test SSH connectivity
          ssh deploy-target "echo 'SSH connection successful'"

      - name: Deploy semantic search
        run: |
          echo "=== Fetching latest code on server ==="
          ssh deploy-target bash -s <<'REMOTE_SCRIPT'
            set -euo pipefail

            cd ${{ env.REPO_PATH }}

            echo "--- Current HEAD ---"
            git log --oneline -1

            echo "--- Fetching latest from origin ---"
            git fetch origin main
            git log --oneline -1

            echo "--- Updating main branch ---"
            git checkout main
            # Hard reset — clear index and working tree completely
            git read-tree HEAD
            git reset
            git checkout -- .
            git clean -fd
            git read-tree origin/main
            git reset --hard origin/main

            echo "--- Syncing submodules ---"
            git submodule update --init --recursive --remote backend frontend semantic-search

            echo "--- New HEAD ---"
            git log --oneline -1

            # Early exit before docker build when this push carries no
            # actual semantic-search changes (per-service last-deploy record).
            if .github/scripts/deploy-change-guard.sh check semantic-search; then
              echo "=== No semantic-search changes since last deploy; early exit ==="
              exit 0
            fi

            echo "--- Capability release guard: building the incoming image ---"
            # Build first so the baseline/compare runs below execute the NEW
            # code: an old image predates scripts/07 and would report with a
            # stale oracle. deploy.sh rebuilds from cache a moment later.
            docker compose build semantic-search

            echo "--- Capability release guard: saving the pre-deploy baseline ---"
            # Index capability comparison, mandatory for every semantic-search
            # release (AGENTS.md "Mandatory index-capability guard"; commands in
            # semantic-search/README.md "릴리스 절차"). Record, per notice, the
            # retrieval capabilities (indexed / title_text / section:<label> /
            # derived:<field>) of the artifact set being served BEFORE this
            # release; the post-deploy step fails the release if the deployed
            # code drops one. Aggregate recall/MRR are blind to this class (a
            # 405-notice title_text regression rode a metric improvement — see
            # agent_memories/24-ai-summary-chunking §4). The scratch dir is
            # gitignored (under artifacts/) and tool-only; the sidecar ignores it.
            rm -rf semantic-search/artifacts/.release
            mkdir -p semantic-search/artifacts/.release
            # The artifacts bind mount is owned by the host, and the container's
            # root is not the host root (a container-side chown on this mount is
            # EPERM-denied — see deploy.sh), so a plain host mkdir leaves a 0755
            # directory the container cannot write into. That aborted the
            # baseline save with PermissionError. deploy.sh solves the same
            # problem for the mount root with chmod 0777; mirror it here.
            chmod 0777 semantic-search/artifacts/.release
            # `</dev/null` on every `compose run` below is mandatory, for the
            # same reason deploy.sh documents for its own: this script is fed on
            # stdin (`ssh bash -s` heredoc) and `compose run` drains it, which
            # silently truncated the whole deploy after the baseline (run
            # 38168627330 reported success having never restarted the engine).
            docker compose run --rm --no-deps --user 0:0 --entrypoint python semantic-search \
              scripts/07_capability_report.py --db /data/lawcast.db \
              --save /app/artifacts/.release/capability-baseline.json </dev/null

            echo "--- Building and restarting semantic search ---"
            cd ${{ env.REPO_PATH }}
            # /cache and /app/artifacts ownership is aligned to uid 1001
            # inside deploy.sh, before the container starts (see its comment).
            ./deploy.sh semantic-search

            echo "--- Waiting for engine to become ready ---"
            # /health answers 200 for every status (loading/ready/failed), so
            # the body must say "ready" — a failed engine would otherwise pass.
            # --max-time keeps a stalled socket from hanging the loop past its
            # 450s budget (observed on run 36857614708 attempt 1).
            READY=false
            for i in $(seq 1 90); do
              BODY=$(curl -sf --max-time 10 http://127.0.0.1:8300/health 2>/dev/null || true)
              if echo "$BODY" | grep -q '"status"[ ]*:[ ]*"ready"'; then
                READY=true
                break
              fi
              sleep 5
            done

            if [ "$READY" = "true" ]; then
              echo "Semantic search is ready"
              echo "$BODY"
            else
              echo "WARNING: semantic search not ready after 450s"
              docker compose logs semantic-search --tail=40 --no-color 2>&1 | head -60
              exit 1
            fi

            echo "--- Capability release guard: comparing the deployed code ---"
            # Rebuild the chunk set from the DEPLOYED code (pure Python, seconds,
            # no embeddings) and diff its per-notice capabilities against the
            # pre-deploy baseline. The candidate is what the next update tick
            # would serve, so a lost class fails BEFORE that tick applies it.
            docker compose run --rm --no-deps --user 0:0 --entrypoint python semantic-search \
              scripts/01_preprocess_chunk.py --db /data/lawcast.db \
              --out /app/artifacts/.release/deployed-chunks.jsonl </dev/null

            if ! docker compose run --rm --no-deps --user 0:0 --entrypoint python semantic-search \
              scripts/07_capability_report.py \
              --chunks /app/artifacts/.release/deployed-chunks.jsonl \
              --db /data/lawcast.db --compare /app/artifacts/.release/capability-baseline.json </dev/null; then
              if [ "${{ inputs.allow_capability_loss }}" = "true" ]; then
                echo "WARNING: capability release guard reported a lost class;"
                echo "allow_capability_loss=true — continuing (record why in the run/PR)."
              else
                echo "ERROR: capability release guard FAILED — the deployed code drops a retrieval capability."
                echo "The next update tick would remove it from the served index."
                echo "Fix the chunking change (or roll back); to ship an intentional loss, re-run"
                echo "this workflow with the allow_capability_loss input and record the reason."
                exit 1
              fi
            fi

            # Record only after the engine is verified ready, so a failed
            # deploy is retried on the next run.
            .github/scripts/deploy-change-guard.sh record semantic-search

            echo "=== Deploy complete ==="
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -rf ~/.ssh/deploy_key

      - name: Tear down WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
